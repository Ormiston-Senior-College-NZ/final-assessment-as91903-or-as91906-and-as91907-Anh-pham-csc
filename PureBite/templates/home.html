<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> PureBite - Food poisoning information and food combination checking tool </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Merienda:wght@300..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="body">
    <header>
        
        <div class="header">
            <a href = "{{ url_for('home')}}" class="title_link">
                <h1 class="title">PureBite</h1>
            </a>

            <div class="gcse-search">
                <script async src="https://cse.google.com/cse.js?cx=91cb9696600824c99"></script>
            </div>
        </div>

        <div>
            <nav class="navigation">
                <a href = "{{ url_for('home')}}" class="{% if request.endpoint == 'home' %}active{% endif %}"> Home </a>
                <a href = "{{ url_for('overall')}}"> Overall information </a>
                <a href = "{{ url_for('transmission')}}"> Transmission routes </a>
                <a href = "{{ url_for('prevention')}}" > Prevention tips </a>
                <a href = "{{ url_for('checker')}}"> Compatible checker </a>
            </nav>
        </div>
    </header>

    <main>
        <p class="lean"> huh </p>
    </main>
    <footer class="contact-footer">
        <section class="contact-section">
            <h2>Contact</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <p class="contact-message {{ category }}">{{ message }}</p>
                {% endfor %}
            {% endwith %}

            <form method="post" action="{{ url_for('contact') }}" class="contact-form">
                <label for="customer_name">Name</label>
                <input
                    id="customer_name"
                    name="customer_name"
                    type="text"
                    placeholder="Your first and last name"
                    required
                >

                <label for="customer_email">Email</label>
                <input
                    id="customer_email"
                    name="customer_email"
                    type="email"
                    placeholder="Your email"
                    required
                >

                <label for="customer_message">Messages</label>
                <textarea
                    id="customer_message"
                    name="customer_message"
                    placeholder="Your messages"
                    required
                ></textarea>

                <button type="submit">SEND</button>
            </form>
        </section>

        <section class="right-side-footer">
            <a href = "{{ url_for('copyright')}}" class="in4-in-footer"> Copyright </a>
            <a href = "{{ url_for('privacy')}}" class="in4-in-footer"> Privacy </a>
            <a href = "{{ url_for('disclaimer')}}" class="in4-in-footer"> Disclaimer </a>
                
            <a href = "{{ url_for('home')}}" class="title_link">
                <h1 class="title-bottom">PureBite</h1>
            </a>
        </section>

    </footer>
</body>
</html>
